<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Calculadora</title>
    <link href="/bootstrap-4.5.3-dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/fontawesome-free-5.15.1-web/css/fontawesome.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="calculadora.css">
    <link rel="stylesheet" href="/fontawesome-free-5.15.1-web/css/all.css"/>
    <link rel="stylesheet" href="/fontawesome-free-5.15.1-web/css/all.min.css"/>
</head>

<body>

<div class="container" style="padding-top: 15%; background-color: lightgray;">

    <div class="row">
        <div class="col-12 col-md-12 col-lg-12" style="text-align: center;" id="res">

        </div>
    
    </div>

    <div class="row">
        <div class="col-12 col-md-6 col-lg-3">
            <button type="button" class="btn btn-secondary" onclick="addNumber()" value="1">1</button>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <button type="button" class="btn btn-secondary" onclick="addNumber()" value="2">2</button>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <button type="button" class="btn btn-secondary" onclick="addNumber()" value="3">3</button>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <button type="button" class="btn btn-secondary" onclick="addOperator()" value="+">+</button>
        </div>
    </div>

    <div class="row">
        <div class="col-12 col-md-6 col-lg-3">
            <button type="button" class="btn btn-secondary" onclick="addNumber()" value="4">4</button>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <button type="button" class="btn btn-secondary" onclick="addNumber()" value="5">5</button>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <button type="button" class="btn btn-secondary" onclick="addNumber()" value="6">6</button>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <button type="button" class="btn btn-secondary" value="- " onclick="addOperator()">-</button>
        </div>
    </div>

    <div class="row">
        <div class="col-12 col-md-6 col-lg-3">
            <button type="button" class="btn btn-secondary" onclick="addNumber()" value="7">7</button>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <button type="button" class="btn btn-secondary" onclick="addNumber()" value="8">8</button>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <button type="button" class="btn btn-secondary" onclick="addNumber()" value="9">9</button>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <button type="button" class="btn btn-secondary" value="*" onclick="addOperator()">*</button>
        </div>
    </div>

    <div class="row">
        <div class="col-12 col-md-6 col-lg-3">
            <button type="button" class="btn btn-secondary" onclick="rst()" value="C">C</button>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <button type="button" class="btn btn-secondary" onclick="addNumber()" value="0">0</button>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <button type="button" class="btn btn-secondary" value="=" onclick="addOperator()">=</button>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <button type="button" class="btn btn-secondary" value="/" onclick="addOperator()">/</button>
        </div>
    </div>
    
    </div>

</div>



    <script src="calculadora.js"></script>
</body>
</html>
