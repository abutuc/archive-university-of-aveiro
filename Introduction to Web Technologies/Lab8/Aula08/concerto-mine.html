<!DOCTYPE html>
<html>

    <head>
        <meta charset="utf-8" />
        <title>Inscrição Concerto</title>
        <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
        <link href="vendor/fontawesome5.15.1/css/all.min.css" rel="stylesheet" />
        <style>
            .jumbotron {
                height: 360px;
                margin: auto;
                z-index: -100;
                color: white;
                background-position: center center;
                background-repeat: no-repeat;
                background-size: cover;
                background-image: url('https://image.shutterstock.com/image-photo/lighting-stage-during-musical-rock-260nw-1145054048.jpg');
            }

            form .error {
                color: #ff0000;
            }

            form .success {
                color: green;
            }
        </style>
    </head>

    <body>
        <div class="jumbotron">
            <div class="container">
                <p class="display-4">Inscrição em Concerto</p>
                <p class="text-info">Selecione dois locais</p>
            </div>
        </div>
        <div class="container mt-3">
            <form action="http://192.168.160.36/FormEcho.aspx" method="POST" id="myForm">
                <div class="row form-group">
                    <label for="name" class="col-form-label col-lg-2">Nome</label>
                    <div class="col-lg-10">
                        <input type="text" class="form-control" name="name" id="name" />
                    </div>
                </div>
                <div class="row form-group">
                    <label for="morada" class="col-form-label col-lg-2">Morada</label>
                    <div class="col-lg-10">
                        <input type="text" class="form-control" name="morada" id="morada" />
                    </div>
                </div>
                <div class="row form-group">
                    <label for="eMail" class="col-form-label col-lg-2">e-Mail</label>
                    <div class="col-lg-4">
                        <input type="email" class="form-control" name="eMail" id="eMail" />
                    </div>
                </div>
                <div class="row form-group">
                    <div class="col-lg-2">Local</div>
                    <div class="col-lg-10" id="xx">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="local" id="local1" value="100" />
                            <label for="local12" class="form-check-label">relva frente</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="local" id="local2" value="80" />
                            <label for="local2" class="form-check-label">relva trás</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="local" id="local3" value="50" />
                            <label for="local3" class="form-check-label">bancada lateral</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="local" id="local4" value="65" />
                            <label for="local4" class="form-check-label">bancada central</label>
                        </div>
                    </div>
                </div>
                <div class="row form-group">
                    <div class="col-lg-2">Preço Máximo</div>
                    <div class="col-lg-2"><input type="text" class="form-control" name="preco" id="preco" readonly />
                    </div>
                </div>
                <div class="row justify-content-md-center">
                    <div class="form-group">
                        <div class="col-lg-12 btn-group">
                            <button type="submit" class="btn btn-outline-success"><i class="fa fa-send-o"></i>
                                Enviar</button>
                            <button type="reset" class="btn btn-outline-secondary"><i class="fa fa-trash-o"></i>
                                Limpar</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <script src="vendor/jquery/jquery.min.js"></script>
        <script src="vendor/bootstrap/js/bootstrap.min.js"></script>
        <!-- jQuery Validation Plugin -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.1/jquery.validate.min.js"></script>
        <script>
            // Wait for the DOM to be ready
            $(document).ready(function () {
                // Initialize form validation on the registration form
                $("#myForm").validate({
                    // Specify validation rules
                    rules: {
                        name: {
                            minlength: 3,
                            required: true,
                        },
                        morada: {
                            minlength: 5,
                            required: true
                        },
                        eMail: {
                            required: true,
                            email: true
                        },
                        local: {
                            minlength: 2,
                            required: true,
                        }
                    },
                    // Specify validation error messages
                    messages: {
                        name: {
                            required: "É necessário inserir um nome!",
                            minlength: "O nome tem de ter, no mínimo, 3 letras!"
                        },
                        morada: {
                            required: "É necessário inserir uma morada!",
                            minlength: "A morada tem de conter, pelo menos, 5 caracteres!"
                        },
                        eMail: {
                            required: "É necessário inserir um email!",
                            email: "Este endereço de e-mail não é válido"
                        },
                        local: {
                            required: "Tens de escolher, pelo menos, 2 locais",
                            minlength: "Tens de escolher, pelo menos, 2 locais",
                        }
                    },
                    // Use some styles
                    highlight: function (element) {
                        $(element).addClass('is-invalid').removeClass("is-valid");
                        // take care of the several checkboxes
                        if (element.type === 'checkbox')
                            this.findByName(element.name).addClass('is-invalid').removeClass(
                                "is-valid");
                    },
                    unhighlight: function (element) {
                        $(element).removeClass('is-invalid').addClass('is-valid');
                        // take care of the several checkboxes
                        if (element.type === 'checkbox')
                            this.findByName(element.name).addClass('is-valid').removeClass(
                                "is-invalid");
                    },
                    // Fix the error placement for the checkboxes
                    errorPlacement: function (error, element) {
                        error.addClass('invalid-feedback')
                        console.log(error);
                        // needed for the checkboxes
                        if (element.attr("name") == "local") {
                            error.appendTo(element.parent().parent());
                        } else {
                            error.insertAfter(element);
                        }
                    },
                    // Make sure the form is submitted to the destination defined
                    // in the "action" attribute of the form when valid
                    submitHandler: function (form) {
                        form.submit();
                    }
                });
            });


            // update max price
            $('input[type="checkbox"]').change(function () {
                var max = 0;
                for (var i = 1; i <= 4; i++) {
                    var cb = "#local" + i;
                    var cb_value = parseFloat($(cb).val())
                    if ($(cb).prop('checked') && cb_value > max)
                        max = cb_value;
                }
                $("#preco").val(max);
            });
        </script>
        <!--<script>
        $(document).ready(function () {
            $('form').submit(function () {

                return false;
            });
        });
    </script>-->
    </body>

</html>
